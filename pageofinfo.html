<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Food Innovation</title>
    <style>
        :root {
            --lime: #e1ff5f;
            --cream: #fffdec;
            --dark: #111;
            --gray: #666;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--cream);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* Background Accent */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            right: 0;
            width: 40vw;
            height: 100vh;
            background: var(--lime);
            z-index: -1;
            border-bottom-left-radius: 100% 50%;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        .header-section {
            margin-bottom: 60px;
        }

        .header-section h1 {
            font-size: 3.5rem;
            margin: 0;
            line-height: 1;
        }

        .header-section p {
            color: var(--gray);
            font-size: 1.1rem;
            margin-top: 15px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            align-items: start;
        }

        /* Info Cards */
        .info-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-top: 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--gray);
        }

        .card p, .card a {
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            color: var(--dark);
            display: block;
            margin: 5px 0;
        }

        .social-link {
            display: inline-block;
            background: #f0f0f0;
            padding: 8px 15px;
            border-radius: 50px;
            margin-right: 5px;
            margin-top: 10px;
            font-size: 0.9rem !important;
            transition: background 0.3s;
        }

        .social-link:hover {
            background: var(--lime);
        }

        /* Contact Form */
        .contact-form {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--lime);
        }

        .submit-btn {
            background: var(--dark);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        @media (max-width: 850px) {
            .contact-grid { grid-template-columns: 1fr; }
            body::before { display: none; }
            .header-section h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h1>GET IN TOUCH.</h1>
        <p>Have questions about our recipes or food innovations? Reach out to the team!</p>
    </div>

    <div class="contact-grid">
        <div class="info-sidebar">
            <div class="card">
                <h3>Emails</h3>
                <a href="mailto:whog9007@gmail.com">whog9007@gmail.com</a>
                <a href="mailto:emmerayandalajao067@gmail.com">emmerayandalajao067@gmail.com</a>
            </div>

            <div class="card">
                <h3>Phone</h3>
                <p>0981 405 8688</p>
            </div>

            <div class="card">
                <h3>Facebook</h3>
                <a href="#" class="social-link">Emmeray Andalajao</a>
                <a href="#" class="social-link">Nicole Oledan</a>
                <a href="#" class="social-link">Jareco Rhyle Rendon</a>
            </div>
        </div>

        <div class="contact-form">
            <form id="foodForm">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="name" placeholder="Juan Dela Cruz" required>
                </div>
                <div class="form-group">
                    <label>Your Email</label>
                    <input type="email" id="email" placeholder="hello@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="message" rows="5" placeholder="Tell us what's on your mind..." required></textarea>
                </div>
                <button type="submit" class="submit-btn">SEND MESSAGE</button>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('foodForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        
        // Simple UI Feedback
        const btn = document.querySelector('.submit-btn');
        btn.innerText = "SENDING...";
        btn.style.background = "#666";
        
        setTimeout(() => {
            alert(Salamat, ${name}! Your message has been sent to the Food Innovation team.);
            btn.innerText = "MESSAGE SENT!";
            btn.style.background = "#e1ff5f";
            btn.style.color = "#111";
            this.reset();
        }, 1500);
    });
</script>

</body>
</html>
<div class="recorder-section">
    <h2>Feedback Messages</h2>
    <div id="messageCounter" class="counter-badge">0 Messages</div>
    <div id="messageList" class="message-list">
        <p class="empty-state">No messages recorded yet.</p>
    </div>
    <button onclick="clearMessages()" class="clear-btn">Clear All Records</button>
</div>
<style>
    
You sent
.recorder-section {
    margin-top: 50px;
    background: white;
    padding: 30px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    grid-column: 1 / -1; /* Makes it span full width */
}

.counter-badge {
    display: inline-block;
    background: var(--lime);
    padding: 5px 15px;
    border-radius: 50px;
    font-weight: bold;
    font-size: 0.8rem;
    margin-bottom: 20px;
}

.message-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
    max-height: 400px;
    overflow-y: auto;
}

.message-item {
    padding: 15px;
    border-left: 5px solid var(--lime);
    background: #f9f9f9;
    border-radius: 8px;
    position: relative;
}

.message-item strong { color: var(--dark); display: block; margin-bottom: 5px; }
.message-item small { color: var(--gray); font-size: 0.75rem; }
.message-item p { margin: 10px 0 0 0; font-size: 0.95rem; }

.clear-btn {
    margin-top: 20px;
    background: transparent;
    border: 1px solid #ff6b6b;
    color: #ff6b6b;
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
}

.clear-btn:hover { background: #ff6b6b; color: white; }
</style>
<script>
    const form = document.getElementById('foodForm');
const messageList = document.getElementById('messageList');
const counter = document.getElementById('messageCounter');

// Load existing messages on page load
document.addEventListener('DOMContentLoaded', displayMessages);

form.addEventListener('submit', function(e) {
    e.preventDefault();

    const newMessage = {
        id: Date.now(),
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value,
        date: new Date().toLocaleString()
    };

    saveMessage(newMessage);
    this.reset();
    displayMessages();
    
    // Visual feedback
    alert("Message recorded successfully!");
});

function saveMessage(msg) {
    let messages = JSON.parse(localStorage.getItem('foodInnoMessages')) || [];
    messages.unshift(msg); // Add new message to the top
    localStorage.setItem('foodInnoMessages', JSON.stringify(messages));
}

function displayMessages() {
    let messages = JSON.parse(localStorage.getItem('foodInnoMessages')) || [];
    
    counter.innerText = ${messages.length} Messages;

    if (messages.length === 0) {
        messageList.innerHTML = '<p class="empty-state">No messages recorded yet.</p>';
        return;
    }

    messageList.innerHTML = messages.map(msg => `
        <div class="message-item">
            <small>${msg.date}</small>
            <strong>${msg.name} (${msg.email})</strong>
            <p>${msg.message}</p>
        </div>
    `).join('');
}

function clearMessages() {
    if(confirm("Are you sure you want to delete all recorded messages?")) {
        localStorage.removeItem('foodInnoMessages');
        displayMessages();
    }
}
</script>
